<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Carousel</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #eee;
    }

    /* ── Three.js canvas container (fullscreen) ── */
    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
    }

    /* ── Overlay UI (sits above the canvas) ── */
    #ui-overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;       /* allow clicks to pass through to canvas */
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #ui-overlay > * {
      pointer-events: auto;       /* re-enable clicks on interactive children */
    }

    /* Model name badge – centered at top */
    #model-name {
      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 22px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #ccc;
      user-select: none;
      white-space: nowrap;
    }

    /* Status message – below model name */
    #status-msg {
      position: absolute;
      top: 68px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      user-select: none;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    /* Navigation buttons – bottom center */
    #nav-buttons {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .ui-btn {
      padding: 10px 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ddd;
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      user-select: none;
    }
    .ui-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .ui-btn:active {
      transform: scale(0.96);
    }
    .ui-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    /* Upload button – distinct accent */
    .ui-btn-accent {
      border-color: rgba(59, 130, 246, 0.3);
      color: #93bbfc;
    }
    .ui-btn-accent:hover {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.5);
      color: #b3d4ff;
    }

    /* Reset pose button – bottom right area */
    #btn-reset-pose {
      position: absolute;
      bottom: 36px; right: 24px;
    }

    /* Upload button – bottom left area */
    #btn-upload {
      position: absolute;
      bottom: 36px; left: 24px;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Three.js canvas is appended here by SceneManager -->
  <div id="canvas-container"></div>

  <!-- Hidden file input for model upload -->
  <input type="file" id="file-input" accept=".glb,.gltf"
         style="display:none" />

  <!-- Overlay UI on top of the canvas -->
  <div id="ui-overlay">
    <!-- Top: model name + status -->
    <div id="model-name">Loading…</div>
    <div id="status-msg"></div>

    <!-- Bottom centre: navigation -->
    <div id="nav-buttons">
      <button class="ui-btn" id="btn-prev">◀  Prev</button>
      <button class="ui-btn" id="btn-next">Next  ▶</button>
    </div>

    <!-- Bottom left: upload -->
    <button class="ui-btn ui-btn-accent" id="btn-upload">⬆  Upload</button>

    <!-- Bottom right: pose reset -->
    <button class="ui-btn" id="btn-reset-pose">↺  Reset Pose</button>
  </div>

  <!-- ── Import map: resolve bare module names to CDN URIs ── -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
    }
  }
  </script>

  <!-- Application entry point -->
  <script type="module" src="main.js"></script>
</body>
</html>
